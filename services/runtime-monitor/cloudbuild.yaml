steps:
  - id: validate-monitor
    name: node:24
    entrypoint: bash
    args:
      - -c
      - npm ci && npx vitest run services/runtime-monitor && npx tsc -p services/runtime-monitor/tsconfig.json --noEmit
  - id: validate-messages
    name: node:24
    entrypoint: npm
    args: [run, 'monitor:messages:check']
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args: [build, -f, services/runtime-monitor/Dockerfile, -t, '${_IMAGE}:$COMMIT_SHA', .]
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:$COMMIT_SHA']
  - id: upload-messages
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args: [storage, cp, services/runtime-monitor/messages.ko.json, 'gs://${_STATE_BUCKET}/monitor/messages-v1.json', '--content-type=application/json', '--cache-control=no-store']
  - id: update-service
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args: [run, services, update, '${_SERVICE}', '--region=${_REGION}', '--image=${_IMAGE}:$COMMIT_SHA']

substitutions:
  _REGION: asia-northeast3
  _SERVICE: talktheme-runtime-monitor
  _IMAGE: asia-northeast3-docker.pkg.dev/project-78d94000-bff9-4358-821/runtime-monitor/runtime-monitor
  _STATE_BUCKET: kt-theme-runtime-monitor-state

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_IMAGE}:$COMMIT_SHA'
