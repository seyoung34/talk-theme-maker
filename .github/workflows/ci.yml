name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # verify-ios-export-hardening.mjs imports .ts sources directly and relies on
      # native type stripping, so the major version must stay >= 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Baseline is the warning count at the time CI was introduced. Errors always fail.
      # Lower this number as warnings get cleaned up; never raise it.
      - name: Lint
        run: npx eslint . --max-warnings 42

      - name: Unit tests
        run: npm test

      # Contract checks. Each guards a cross-cutting invariant that a focused change
      # can silently break, so they run on every PR rather than on demand.
      - name: Text encoding
        if: '!cancelled()'
        run: npm run check:text

      - name: iOS slot metadata
        if: '!cancelled()'
        run: npm run check:ios-slots

      - name: Android color slots
        if: '!cancelled()'
        run: npm run check:android-colors

      - name: Android bundled assets
        if: '!cancelled()'
        run: npm run check:android-assets

      - name: Edge-safe imports
        if: '!cancelled()'
        run: npm run check:edge-imports

      - name: iOS export hardening
        if: '!cancelled()'
        run: npm run check:ios-export

      - name: Admin asset domain
        if: '!cancelled()'
        run: npm run check:admin-asset-domain

  # E2E는 next build까지 포함해 10분 남짓 걸리므로 PR마다 돌리지 않고 main push에서만 돌린다.
  # 대신 픽셀 방향처럼 단위 테스트가 닿지 못하는 계약(e2e/AGENTS.md 참조)의 회귀는 머지 직후
  # 여기서 잡힌다. PR 단계에서 확인이 필요하면 로컬에서 `npm run test:e2e`를 돌린다.
  e2e:
    name: e2e (main push only)
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 두 project(desktop/mobile) 모두 chromium 기반이다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
